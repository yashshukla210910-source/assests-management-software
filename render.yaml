services:
  - type: web
    name: asset-management-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asset-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RPC_URL
        value: https://rpc.ankr.com/eth_sepolia
      - key: PRIVATE_KEY
        value: YOUR_SEPOLIA_PRIVATE_KEY_HERE

databases:
  - name: asset-management-db
    databaseName: asset_management
    user: admin
    plan: free
